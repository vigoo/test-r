[package]
name = "cargo-test-r"
version = "2.2.11"
edition = "2024"
license = "Apache-2.0"
description = "Test framework for Rust - cargo extensions"
repository = "https://github.com/vigoo/test-r"
readme = "../README.md"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cargo-test-r-v{ version }/cargo-test-r-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.103"
camino = "1.2.2"
clap = { version = "4.5", features = ["derive"] }
fs_extra = "1.3.0"
humansize = "2.1.3"
glob-match = "0.2.1"
nextest-metadata = "0.13.3"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
tar = "0.4.44"
tempfile = "3"
uuid = { version = "1.21", features = ["v4"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
url = "2.5"
workspace_root = "0.2.0"
zstd = "0.13.3"

[target.'cfg(target_os = "linux")'.dependencies]
goblin = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
