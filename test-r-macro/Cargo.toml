[package]
name = "test-r-macro"
edition = "2024"
version = "1.4.15"
license = "Apache-2.0"
description = "Test framework for Rust (macros)"
repository = "https://github.com/vigoo/test-r"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
test-r-core = { version = "13.0.0", path = "../test-r-core" }

darling = "0.21.3"
jiff = { version = "0.2", default-features = false, features = ["std"] }
proc-macro2 = "1"
quote = "1"
rand = "0.10"
syn = { version = "2", features = ["full"] }
